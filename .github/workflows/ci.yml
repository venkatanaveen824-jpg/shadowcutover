name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t shadowcutover:ci .
      - name: Smoke test the container
        run: |
          docker run -d -p 7860:7860 --name sc shadowcutover:ci
          for i in $(seq 1 20); do curl -sf localhost:7860/api/status && break; sleep 1; done
          curl -sf localhost:7860/api/status
          docker rm -f sc
